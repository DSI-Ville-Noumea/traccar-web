services:
  traccar-vdn:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8082:8082" # web/API
      - "5000-5150:5000-5150" # plages de ports protocoles traqueurs (TCP)
      - "5000-5150:5000-5150/udp"
    volumes:
      - traccar-conf:/opt/traccar/conf
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs

volumes:
  traccar-conf:
  traccar-data:
  traccar-logs:
